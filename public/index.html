<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCal - Scientific Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="calc-box">
      <div class="top-row">
        <h1>SCal</h1>
        <div class="angle-area">
          <span id="modeLabel">DEG</span>
          <button id="angleToggle" class="angle-btn">DEG</button>
        </div>
      </div>

      <div class="screen">
        <div class="screen-bar">
          <span id="status">READY</span>
          <button id="clearHistory" class="link-btn">clear history</button>
        </div>
        <div id="expression" class="expr">0</div>
        <div id="result" class="ans">0</div>
      </div>

      <div class="btns">
        <!-- row 1 - sci -->
        <button class="b fn" data-action="sin">sin</button>
        <button class="b fn" data-action="cos">cos</button>
        <button class="b fn" data-action="tan">tan</button>
        <button class="b fn" data-action="log">log</button>
        <button class="b fn" data-action="ln">ln</button>

        <!-- row 2 -->
        <button class="b fn" data-action="asin">sin⁻¹</button>
        <button class="b fn" data-action="acos">cos⁻¹</button>
        <button class="b fn" data-action="atan">tan⁻¹</button>
        <button class="b fn" data-action="sqrt">√</button>
        <button class="b fn" data-action="cbrt">∛</button>

        <!-- row 3 -->
        <button class="b fn" data-insert="(">(</button>
        <button class="b fn" data-insert=")">)</button>
        <button class="b fn" data-action="square">x²</button>
        <button class="b fn" data-action="cube">x³</button>
        <button class="b fn" data-action="factorial">x!</button>

        <!-- row 4 - hyp -->
        <button class="b fn" data-action="sinh">sinh</button>
        <button class="b fn" data-action="cosh">cosh</button>
        <button class="b fn" data-action="tanh">tanh</button>
        <button class="b fn" data-insert="π">π</button>
        <button class="b fn" data-insert="e">e</button>

        <!-- row 5 - util -->
        <button class="b cl" data-command="clear">AC</button>
        <button class="b del" data-command="delete">DEL</button>
        <button class="b fn" data-action="percent">%</button>
        <button class="b op" data-insert="/">÷</button>
        <button class="b op" data-insert="*">×</button>

        <!-- row 6 - nums -->
        <button class="b num" data-insert="7">7</button>
        <button class="b num" data-insert="8">8</button>
        <button class="b num" data-insert="9">9</button>
        <button class="b op" data-insert="-">−</button>
        <button class="b op" data-insert="+">+</button>

        <!-- row 7 -->
        <button class="b num" data-insert="4">4</button>
        <button class="b num" data-insert="5">5</button>
        <button class="b num" data-insert="6">6</button>
        <button class="b num" data-insert=".">.</button>
        <button class="b op" data-insert="^">xʸ</button>

        <!-- row 8 -->
        <button class="b num" data-insert="1">1</button>
        <button class="b num" data-insert="2">2</button>
        <button class="b num" data-insert="3">3</button>
        <button class="b num" data-insert="0">0</button>
        <button class="b eq" data-command="equals">=</button>
      </div>
      <p class="tip">keyboard works too — enter = calculate, esc = clear, backspace = delete</p>
    </div>

    <div class="hist-box">
      <div class="hist-top">
        <h2>History</h2>
        <span class="hist-icon">↺</span>
      </div>
      <div id="history" class="hist-list"><div class="empty">nothing here yet</div></div>
    </div>
  </div>

  <footer>built by saurav</footer>

  <script src="script.js"></script>
</body>
</html>
